<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>DuckyKeyboardESP</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="app">
    <header class="ble-header">
      <div class="ble-label">BLE</div>
      <div id="status" class="status" role="status" aria-live="polite">ESP32 wird gesucht...</div>
      <button id="connectBtn" class="small-button">Verbinden</button>
      <button id="disconnectBtn" class="small-button" disabled>Trennen</button>
    </header>

    <section class="touchpad-area">
      <div id="touchpad" class="touchpad" aria-label="Touchpad: Finger bewegen, um den Mauszeiger zu steuern">
        <span>Touchpad – hier wischen</span>
      </div>
      <div class="mouse-buttons">
        <button id="leftClick" class="outline-button">Linksklick</button>
        <button id="middleClick" class="outline-button">Mittelklick</button>
        <button id="rightClick" class="outline-button">Rechtsklick</button>
      </div>
    </section>

    <section class="script-area">
      <label class="sr-only" for="script">Script</label>
      <textarea id="script" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Hier dein Script eingeben..."></textarea>
    </section>

    <section class="controls">
      <div class="three-buttons">
        <button id="enterBtn" class="outline-button">ENTER</button>
        <button id="delayBtn" class="outline-button">DELAY</button>
        <button id="textBtn" class="outline-button">Text</button>
      </div>
      <button id="comboBtn" class="outline-button wide">Tastenkombination einfügen</button>
      <button id="sendBtn" class="send-button" disabled>SCRIPT SENDEN</button>
      <div id="progressWrap" class="progress-wrap" hidden>
        <div class="progress-track"><div id="progressBar"></div></div>
        <span id="progressText"></span>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
    <footer>ESP32-S3 Keyboard · BLE · Web v4</footer>
  </main>

  <dialog id="textDialog">
    <form method="dialog" id="textForm">
      <h2>Text</h2>
      <p>Gib den normalen Text ein:</p>
      <label class="sr-only" for="textValue">Text</label>
      <textarea id="textValue" rows="5" placeholder="Text"></textarea>
      <div class="dialog-actions">
        <button type="button" class="outline-button" data-close="textDialog">Abbrechen</button>
        <button type="button" id="insertTextBtn" class="dialog-primary">Einfügen</button>
      </div>
    </form>
  </dialog>

  <dialog id="delayDialog">
    <form method="dialog" id="delayForm">
      <h2>Delay einfügen</h2>
      <p>Zeit in Millisekunden:</p>
      <label class="sr-only" for="delayValue">Millisekunden</label>
      <input id="delayValue" type="number" min="1" step="1" value="1000">
      <small>Beispiel: 1000 = 1 Sekunde</small>
      <div class="dialog-actions">
        <button type="button" class="outline-button" data-close="delayDialog">Abbrechen</button>
        <button type="button" id="insertDelayBtn" class="dialog-primary">Einfügen</button>
      </div>
    </form>
  </dialog>

  <dialog id="comboDialog">
    <form method="dialog" id="comboForm">
      <h2>Tastenkombination</h2>
      <p>Modifier:</p>
      <div class="modifier-list">
        <label><input type="checkbox" id="modCtrl"> CTRL</label>
        <label><input type="checkbox" id="modAlt"> ALT</label>
        <label><input type="checkbox" id="modShift"> SHIFT</label>
        <label><input type="checkbox" id="modWin"> WIN</label>
      </div>
      <label for="selectedKey">Taste:</label>
      <select id="selectedKey"></select>
      <p id="comboPreview" class="preview">Kombination: A</p>
      <div class="dialog-actions">
        <button type="button" class="outline-button" data-close="comboDialog">Abbrechen</button>
        <button type="button" id="insertComboBtn" class="dialog-primary">Einfügen</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=4"></script>
</body>
</html>
